name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Python from .python-version
        run: |
          uv python install
          uv sync --frozen --extra dev
      - name: Pytest
        run: uv run pytest -q
      - name: Selftest
        run: uv run python -m moonshot selftest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install toolchain
        run: |
          uv python install
          uv sync --frozen --extra dev
      - name: Ruff check
        run: uv run ruff check moonshot tests
      - name: Ruff format
        run: uv run ruff format --check moonshot tests
      - name: Mypy (config + risk)
        run: uv run mypy moonshot/config.py moonshot/risk.py
